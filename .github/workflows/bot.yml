name: Run Forex Bot During Market Hours

on:
  schedule:
    - cron: '50-59/5 22 * * 0'  # Sunday 22:50–22:59 UTC
    - cron: '0-55/5 23 * * 0'   # Sunday 23:00–23:55 UTC
    - cron: '*/5 * * * 1-4'     # Monday to Thursday
    - cron: '*/5 0-2 * * 5'     # Friday until 03:00 UTC

  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        run: python index.py
